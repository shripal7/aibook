name = "aibook-api"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# All book content (metadata, per-book data, and media) is read from KV at request time,
# so adding a book is just writing KV keys — no redeploy. See scripts/upload-content.py
# and docs ADDING-A-BOOK.md.
[[kv_namespaces]]
binding = "CONTENT"
id = "1483a459d87f4a93943ce02c9d7e4809"

# Workers AI powers the live agent personas (with a canned fallback in agents.ts).
[ai]
binding = "AI"

# Reading analytics via KV counters is always on (GET /api/stats). For the richer, precise,
# queryable layer (per-event geo/visitor via Analytics Engine SQL), enable Analytics Engine in
# the Cloudflare dashboard, then uncomment the binding below and redeploy — the code already
# guards on env.AE, so no code change is needed.
# [[analytics_engine_datasets]]
# binding = "AE"
# dataset = "aibook_events"
