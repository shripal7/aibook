name = "aibook-api"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# Static assets: serves the /media/*.png images at the same paths the JSON embeds.
# A request that does not match an asset (e.g. /api/*) falls through to the Worker.
[assets]
directory = "public"
binding = "ASSETS"

# Workers AI powers the live agent personas (with a canned fallback in agents.ts).
[ai]
binding = "AI"
